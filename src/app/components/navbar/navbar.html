<header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm transition-colors duration-200">
  <div class="max-w-6xl mx-auto px-8 py-4 flex items-center justify-between">
    <a routerLink="/" class="text-xl sm:text-2xl font-bold text-purple-600 dark:text-purple-400 hover:opacity-80 transition cursor-pointer">
      Explorador de Países
    </a>

    <button type="button" (click)="themeService.toggleTheme()" class="flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition cursor-pointer">
      @if (themeService.isDark()) {
      <span>☀️ Modo Claro</span>
      } @else {
      <span>🌙 Modo Escuro</span>
      }
    </button>
  </div>
</header>
